- id: space-recognition
  field_id: intelligent-space
  title: Space Recognition
  title_jp: 空間理解
  description: 　
  description_jp: 　
  image: /images/projects/ispace/space-recognition/chenj.png
  subtopics:
  - title: Living Support System Using Multimodal Situation Understanding
    title_jp: マルチモーダル環境認識による生活支援システムの開発
    description: This study aims to develop an intelligent living support system that understands users' states and behaviors in a smart environment. The system collects information from indoor cameras, environmental sensors, and wearable devices, including user location and actions, room temperature, illuminance, heart rate, and body temperature. By integrating heterogeneous data, the system estimates the user’s current situation. It provides appropriate support, such as controlling home appliances accordingly. For example, when the room temperature is high, and changes are observed in the user’s body temperature or heart rate, the system can operate a fan by considering both environmental information and biological information. Furthermore, by combining these data with camera-captured human motion information, the system can infer internal states, such as fatigue or heat discomfort, that are difficult to determine from images alone. Through this approach, the study aims to create a natural and user-friendly living support environment.
    description_jp: 本研究では，知能化空間においてユーザの状態や行動を理解し，日常生活を適切に支援するシステムの実現を目指しています．室内カメラや環境センサ，ウェアラブル端末から，ユーザの位置や行動，室内の温度，照度，心拍数，体温などを取得します．これらの情報を統合することで，ユーザが置かれている状況を推定し，その状況に応じた家電制御や生活支援を行います．例えば，室温が高く，体温や心拍数にも変化が見られる場合には，扇風機を稼働させるなど，環境情報と生体情報の両方を考慮した支援を提供します．さらに，カメラで取得した動作情報と組み合わせることで，画像だけでは判別しにくい疲労や暑さなどの内的状態も推察できます．これにより，ユーザにとって自然で使いやすい生活支援環境の構築を目指します．
    media: /images/projects/ispace/space-recognition/chenj.png

  - title: Situation Understanding Using Temporal Scene Graphs with Multi-Camera
    title_jp: 複数カメラによる時系列シーングラフを用いた状況認識
    description: This study aims to develop a method for situation understanding in intelligent spaces using multiple cameras and temporal scene graphs. In an intelligent space, machines need to understand what is happening in a room by recognizing relationships among people, objects, and actions. However, a single camera may fail to observe people or objects hidden behind obstacles, making robust recognition difficult. In addition, directly feeding video data into an AI model makes it difficult to handle temporal changes and event flow. To address these issues, the proposed method observes a room from multiple viewpoints. It represents relationships among people, objects, and actions as scene graphs. These graphs are then connected along the time axis to construct temporal scene graphs. By inputting them into a large language model, the study examines applications such as situation description, question answering, and action support based on a structured understanding of indoor events.
    description_jp: 本研究では，知能化空間においてロボットが室内で発生する出来事を理解するため，複数カメラによる時系列シーングラフを用いた状況認識手法を開発しています．知能化空間では，人，物体，行動の関係を正確に把握することが重要です．しかし，単一カメラでは物陰による遮蔽の影響を受けやすく，人物や物体を十分に観測できない場合があります．また，映像をそのままAIに入力する方法では，時間的な変化や出来事の流れを扱いにくいという課題があります．そこで本研究では，複数のカメラで室内を観測し，人物，物体，行動の関係をシーングラフとして表現します．さらに，それらを時間方向につなげた時系列シーングラフを構築し，LLMに入力することで，状況説明，質問応答，行動支援への応用を目指します．
    media: /images/projects/ispace/space-recognition/morita.png

  - title: Spatial Log System for Recording Relationships Between People and Objects
    title_jp: 人と物体の関係を記録する空間ログ生成
    description: This study focuses on a spatial log system for realizing an intelligent space that provides appropriate services to users. The proposed system records human actions and environmental changes, enabling the space to understand what happened and support users based on their activity history. Multiple sensors are installed in the space, and people are detected using RGB-D cameras and YOLO. The system also recognizes objects that have been moved through human actions and identifies who moved which object. In addition, to acquire more detailed information about target objects, the system uses the mobile robot Kachaka equipped with a camera mounted on an arm. The robot moves to the target object's position and observes it at close range, complementing information that is difficult to obtain with fixed sensors alone. Through this approach, the study aims to understand in detail the relationships between people and objects and to apply spatial logs to intelligent support services in daily environments.
    description_jp: 本研究では，ユーザに適切なサービスを提供する知能化空間の実現を目的として，空間内で発生する人物行動や物体変化を記録する空間ログシステムの研究を行っています．空間内には複数のセンサを設置しており，RGB-DカメラとYOLOを用いて人物の検出を行っています．また，人物の行動に伴って移動した物体を認識し，誰がどの物体を動かしたかを把握できるようにしています．さらに，対象物体に関するより詳細な情報を取得するために，移動ロボットKachakaとアーム付きカメラを活用し，対象物体の位置まで移動して近距離から観測を行います．これにより，空間内での人と物体の関係性を詳細に理解し，行動履歴を活用した支援システムへの応用を目指しています．
    media: /images/projects/ispace/space-recognition/kawai.png

  - title: Multi-Tracking System with Face Recognition Using Multiple Cameras
    title_jp: 複数カメラを用いた顔認識付きマルチトラッキングシステムの開発
    description: This study aims to develop a person identification system for intelligent spaces that is location-independent. In conventional methods, face recognition is performed at fixed points, such as entrances, and a person’s name is associated with their position. Therefore, users must be aware of the camera and behave in a way that allows it to be recognized. In addition, face recognition and person tracking, or ReID, operate independently, which can cause identity switching when a person is occluded or tracked for a long time. To address these issues, this study re-executes face recognition at appropriate times during the tracking process. It integrates information from multiple DINDs (distributed intelligent network devices) equipped with cameras and sensors. By combining these data, the system maintains consistent personal identification across the entire space. Through this approach, the study aims to realize an intelligent space that users can access naturally without performing any special actions.
    description_jp: 本研究では，知能化空間において，特定の場所に依存しない人物識別システムの構築を目指しています．従来手法では，入口などの特定地点で顔認識を行い，名前と位置を対応付けていたため，ユーザがカメラを意識して行動する必要がありました．また，顔認識と人物追跡，ReID，が独立して動作するため，遮蔽物や長時間の追跡によってIDの切り替わりが発生する課題があります．そこで本研究では，人物追跡中に適切なタイミングで顔認識を再実行し，複数のDIND（カメラやセンサを備えた分散知能デバイス）から得られる情報を統合します．これにより，空間全体で一貫した個人識別を実現し，ユーザが特別な操作を行わなくても自然に利用できる知能化空間の構築を目指します．
    media: /images/projects/ispace/space-recognition/nakai.png
  order: 1

- id: service-design
  field_id: intelligent-space
  title: Service Design
  title_jp: サービス設計
  description: 　
  description_jp: 　
  image: /images/projects/ispace/yoshida.png
  subtopics:
  - title: Spatial coding for smart home
    title_jp: スマートホームのための空間コーディングの設計
    description: This study aims to develop a spatial coding technology that enables users to define the behaviors of robots and home appliances through a graphical user interface. To realize an intelligent space, it is necessary to create an environment that is convenient and comfortable for each user. However, the functions required in such a space differ depending on individual needs, and it is difficult for users without programming expertise to configure device behaviors flexibly. To address this issue, the proposed method allows users to assign services directly to virtual areas in the physical environment. For example, a virtual area can be set under a blue chair, and a service can be designed so that a fan starts operating when a person stays in that area for five seconds. By using this technology, users can design spatial behaviors according to their own purposes and daily situations. Ultimately, this study aims to create a comfortable, intelligent environment that can be customized by users themselves.
    description_jp: 知能化空間を実現するためには，ユーザにとって便利で快適な環境を構築することが重要です．しかし，空間に求められる機能はユーザごとに異なり，専門的なプログラミング技術がなければ，ロボットや家電の動作を柔軟に設定することは容易ではありません．そこで本研究では，GUI上でロボットや家電のふるまいを直感的に定義できる「空間コーディング」技術を開発しています．例えば，青い椅子の下に仮想的なエリアを設定し，そのエリアに人が5秒間滞在した場合に扇風機が稼働するサービスを設計できます．この仕組みにより，専門知識の有無にかかわらず，ユーザの目的や生活場面に応じたサービスを構築できます．将来的には，ユーザ自身が空間のふるまいを自由にデザインできる，快適で賢い環境の実現を目指します．
    media: /images/projects/ispace/service-design/yoshida.png
  order: 1

