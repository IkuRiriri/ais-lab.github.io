- id: autonomous-mobile-robot
  field_id: intelligent-robotics
  title: Autonomous Mobile Robots
  title_jp: 自律移動ロボット
  description:  
  description_jp:  
  image: /images/projects/intelligent-robotics/autonomous-mobile-robot/autonomous-mobile-robot.jpg
  subtopics:
  - title: Cooperative Multi-Robot System for Automated Roadside Weeding
    title_jp: マルチロボットによる道路除草の自動化
    description: This study aims to develop a cooperative roadside weeding system using multiple small robots. Roadside weeding still relies heavily on manual labor, leading to labor shortages and heavy physical burdens on workers. However, concentrating sensing, decision-making, and weeding functions in a single advanced robot has limitations in terms of cost, scalability, and practical operation. To address these issues, this study proposes a system comprising three robots a leading robot, a working robot, and an inspection robot. These robots move in a line along the road shoulder, each playing a different role. The leading robot observes terrain conditions and detects obstacles ahead. The working robot uses this information to detect and remove weeds. The inspection robot follows behind, evaluates the work results, and requests additional weeding where necessary. By sharing position data and task status, the robots adjust their spacing, speed, and stopping and restarting timing. This approach is expected to reduce missed weeds and unnecessary movement, resulting in safer, more efficient outdoor weeding.
    description_jp: 本研究では，複数の小型ロボットが連携して道路脇の除草作業を行うシステムの開発に取り組んでいます．道路除草は現在も人手に頼る部分が大きく，人手不足や作業者の負担が課題となっています．一方で，1台の高機能なロボットに多くの処理を集中させる方法は，コストや運用性の面で限界があります．そこで本研究では，先導ロボット，作業ロボット，確認ロボットの3台が役割を分担し，路肩を一列に移動しながら作業を進める仕組みを目指しています．先導ロボットは前方の地形や障害物を確認し，作業ロボットはその情報を利用して雑草の検出と除去を行います．確認ロボットは後方から作業結果を確認し，必要個所の再除草を指示します．さらに，各ロボットが位置情報や作業状況を共有することで，走行間隔や速度，停止・再開のタイミングを調整します．これにより，刈り残しや無駄な移動を減らし，屋外でも安全で効率的な除草作業の実現を目指しています．
    media: /images/projects/intelligent-robotics/autonomous-mobile-robot/matsushita.mp4

  - title: Autonomous Robot Navigation System for Semantic Outdoor Map Generation
    title_jp: 自律移動ロボットによる屋外セマンティックマップの生成
    description: This study aims to develop a cooperative autonomous navigation system for multiple R4 (Ritsumeikan Road Removal Robot) units by introducing a leading robot that acts as a command unit. The goal is to improve the operational efficiency of autonomous roadside weeding. The leading robot integrates color and depth information obtained from an onboard RGB-D camera to generate a semantic map in real time. This map enables both object identification and three-dimensional position estimation. In addition to obstacle locations, the map includes weed distribution density and terrain attributes. Based on this information, the system dynamically calculates and assigns optimal work areas and travel paths to multiple following weeding robots. The proposed algorithm enables the robots to adjust their tasks and routes in response to changes in the surrounding environment. By closely integrating advanced visual environment recognition with multi-agent cooperative control, this research aims to automate efficient weeding over wide roadside areas, which is difficult to achieve with a single robot.
    description_jp: 本研究では，自律除草ロボットR4，Ritsumeikan Road Removal Robot，の運用効率を高めるため，司令塔となる先導ロボットを開発し，複数機による協調自律走行システムの構築に取り組んでいます．先導ロボットは，搭載したRGB-Dカメラから得られるカラー情報と深度情報を統合し，物体の識別と三次元的な位置推定を同時に行うセマンティックマップをリアルタイムに生成します．このマップには，障害物の位置に加えて，雑草の分布密度や地形属性を重畳します．さらに，後続する複数の除草ロボットに対して，作業領域の割り当てと移動経路を動的に算出し指示するアルゴリズムを実装します．高度な環境認識とマルチエージェント協調制御を連携させることで，単一機では難しい広域除草作業の効率的な自動化を目指します．
    media: /images/projects/intelligent-robotics/autonomous-mobile-robot/okada.png
  order: 1

- id: physical-ai
  field_id: intelligent-robotics
  title: Physical AI
  title_jp: Physical AI
  description: 　
  description_jp: 　
  image: /images/projects/intelligent-robotics/physical-ai/fumimoto.png
  subtopics:
  - title: Autonomous Robot Control Balancing Task Execution and Collision Avoidance
    title_jp: タスク実行と衝突回避を両立するロボットの自律制御
    description: The research ensures a robot can successfully complete its main tasks while safely working unattended. We achieve this by training the robot within a self-play reinforcement learning framework, allowing it to continuously improve both task execution and collision avoidance. To build deep spatial awareness, the system distills multimodal vision data and internal motor proprioception into a single model that detects potential crashes. If the robot is about to hit itself or an unseen object, this real-time policy anticipates the move to prevent self-destruction and minimize damage to the surroundings. Ultimately, this approach enables reliable, autonomous robot operation in unpredictable environments without the risk of working hazzard.
    description_jp: 本研究では，未監視環境下でもロボットが安全にタスクを遂行できる自律制御手法の実現を目指しています．予測困難な環境での自律運用には，目的作業の達成だけでなく，自己衝突や周囲の物体との接触を事前に回避する能力が必要です．そこで本研究では，自己対戦型強化学習を用いて，タスク実行能力と衝突回避能力を同時に向上させます．さらに，視覚情報とモータの固有感覚情報を単一モデルに蒸留することで，高度な空間認識を実現します．このモデルは，ロボット自身や未知物体との衝突リスクをリアルタイムに予測し，危険な動作を回避します．これにより，ロボットの破損や周囲への被害を最小限に抑え，災害リスクの少ない信頼性の高い自律運用を可能にします．
    media: /images/projects/intelligent-robotics/physical-ai/duong.png

  # - title: Robot Navigation Using Campus Map and Vision Information
  #   title_jp: 視覚情報と地図情報に基づくロボットナビゲーション
  #   description: This research aims to develop an autonomous mobile robot system using a Vision Language Model (VLM). Conventional robot navigation systems often rely on SLAM-based map generation or pre-defined coordinates. In contrast, this research proposes a system that utilizes campus maps designed for humans together with visual information, enabling the robot to move flexibly while understanding its surrounding environment. Specifically, the system takes camera images and natural language instructions from users as inputs, and the VLM determines navigation routes and robot actions. In addition, to improve localization accuracy, additional annotations will be added to existing map data and integrated with environmental perception. Furthermore, this research will address challenges related to communication between the robot and the server, as well as real-time processing, with the goal of achieving a stable navigation system.
  #   description_jp: 本研究では，Vision Language Model（VLM）を活用した自律移動ロボットシステムの実現を目指しています．従来のロボットナビゲーションは，SLAMによる地図生成や事前に設定された座標に依存することが多く，環境の変化や人の自然な指示に柔軟に対応することが課題です．そこで本研究では，人間が利用するキャンパスマップとロボットのカメラ画像を組み合わせ，周囲環境を理解しながら移動する仕組みを構築します．具体的には，ユーザの自然言語指示と視覚情報を入力として，VLMが移動経路や行動を判断します．また，既存の地図データに追加注釈を付与し，環境認識と統合することで位置推定精度の向上を図ります．さらに，ロボットとサーバ間の通信やリアルタイム処理の課題にも取り組み，安定したナビゲーションシステムの実現を目指します．
  #   media: 

  - title: Efficiency Optimization of Object Grasping by Robot Arm Pushing
    title_jp: ロボットアームの押し動作による物体把持の効率化
    description: This study integrates pushing manipulation by a robot arm using visual prompts. When humans organize objects on a desk, they not only push an object to a target position but also use different manipulation skills depending on the situation. For example, they gather scattered objects into a single area (grouping) or separate a single object from a cluttered pile (singulation). This research develops a flow-matching-based generative model that integrates these three skills, pushing, grouping, and singulation, into a single policy. In addition, a large vision-language model is used to interpret visual prompts given as points on an image and to understand the intended manipulation. Through this approach, the robot can select and execute appropriate actions from visual information, even in complex real-world environments. Ultimately, the study aims to build an autonomous system capable of performing flexible, advanced object manipulation in a human-like manner.
    description_jp: 本研究テーマは、視覚的プロンプトを用いたロボットアームによる統合的な「押し（Pushing）」動作の実現です。人間は机を片付ける際、物体を目的の位置へ移動させるだけでなく、複数箇所に散らばった物を一箇所に集めたり（Grouping）、密集した山から一つだけを切り離したり（Singulation）と、多様な押し動作を使い分けています。本研究では、これら３つの異なるスキルを単一のポリシーとして統合する生成モデル（Flow Matching）ベースの手法を構築します。大規模視覚言語モデル（VLM）を利用して画像上の点（視覚的プロンプト）で指示を与えることで、複雑な現実環境においても、ロボットが視覚情報から状況を理解し、人間のように柔軟で高度な物体操作を行える自律システムの構築を目指します。
    media: /images/projects/intelligent-robotics/physical-ai/fumimoto.png
  order: 2

- id: momo
  field_id: intelligent-robotics
  title: Ceiling-Climbing Robot
  title_jp: 天井面移動ロボット
  description: Mobile Module (MoMo) is a ceiling-Climbing robot. By moving along the ceiling, it can navigate the space without obstructing users.
  description_jp: Mobile Module (MoMo) は，天井面を移動するロボットです．天井面を移動することで，ユーザの邪魔にならずに空間内を移動できます．
  image: /images/projects/intelligent-robotics/momo/momo.jpg
  subtopics:
  - title: Comprehensive Sensing Using Multi-Agent Reinforcement Learning
    title_jp: マルチエージェント強化学習を用いた網羅的センシングの実現
    description: This study aims to realize safe collaboration between humans and robots by developing a cooperative tracking system using multiple MoMo robots. For humans and robots to work together safely, it is essential to understand the surrounding environment with few blind spots and high accuracy. In dynamic environments, robots must continuously track and observe target objects or people while autonomously determining their positions and roles according to the situation. To address this challenge, this study applies multi-agent reinforcement learning to control a group of MoMo robots so that they can observe the target from multiple directions without losing coverage. Each robot is assigned a dynamic role, such as a front-view camera, rear-view camera, or overview camera. These roles are switched flexibly in response to the target's motion and changes in the environment. Through this approach, the system aims to achieve seamless and comprehensive sensing, enabling real-time, high-quality spatial understanding in complex human-robot collaborative environments.
    description_jp: 人間とロボットが安全に協調して作業するには，死角のない高度な環境認識が不可欠です．本研究の目的は，複数台のMoMoを制御してシームレスな網羅的センシングを実現することで，リアルタイムに高品質な空間把握を可能にすることです．動的に変化する環境下で対象を継続的に追跡・観測するためには，ロボット群の配置を状況に応じて自律的かつ最適に決定する仕組みが必要です．本研究では，マルチエージェント強化学習（MARL）を用い，MoMoが対象を死角なく観測し続ける「協調追跡システム」を確立します． 各ロボットに動的な役割（ロール）を与え，状況に応じて「正面からの撮影機」，「背面からの撮影機」，「全体撮影機」などを切り替えながら担うことで，複雑な動的環境に適応可能な群ロボット制御を行います．
    media: /images/projects/intelligent-robotics/momo/shimizu.png

  - title: High-Speed, Stable Movement of the Ceiling-Mounted Mobile Robot
    title_jp: 天井面移動ロボットの高速・安定走行の実現
    description: This study proposes an improved structure for the Mobile Module (MoMo), a ceiling-mounted mobile robot, to achieve faster, more stable movement. MoMo moves while ceiling protrusions pass through rails mounted on its body, and springs press the wheels against the ceiling surface. However, in the conventional structure, friction and interference between the rails and protrusions made movement unstable. To address this issue, both the rail and protrusion structures were improved. The rail was redesigned as a two-layer structure, reducing joints and suppressing interference with the protrusions. In addition, the material was changed from aluminum to acrylic and from polycarbonate to acrylic to reduce weight and improve adaptability to height differences by leveraging their slight deformability during contact. Both ends of the protrusions were designed with circular arcs to improve step-passing performance. As a result, improvements in moving speed, maximum payload, and movement stability were confirmed. Future work will examine autonomous recovery from abnormal states, abnormality detection, and avoidance methods.
    description_jp: 本研究では，天井面移動ロボットMobile Module（MoMo）の高速かつ安定した移動を実現するため，レール構造と突起構造を改良しています．MoMoは，機体に搭載したレールに天井面の突起を通し，ばねで車輪を押し付けながら移動します．しかし，従来構造ではレールと突起の摩擦や干渉により，走行が不安定になる課題がありました．そこで，レールを上下二層構造として継ぎ目を削減し，突起との干渉を抑制しました．また，材質をアルミニウムからアクリルおよびポリカーボネートへ変更し，軽量化と段差追従性の向上を図りました．さらに，突起両端を円弧形状にすることで段差通過性能も改善しています．その結果，移動速度，最大積載重量，移動安定性の向上を確認しています．現在は，異常状態からの自律復帰制御や異常検知，回避手法を検討しています．
    media: /images/projects/intelligent-robotics/momo/fujii.png
  order: 3

- id: slam
  field_id: intelligent-robotics
  title: SLAM
  title_jp: SLAM
  description:  
  description_jp:  
  image: /images/projects/intelligent-robotics/slam/kawahara.png
  subtopics:
  - title: Self-localiztion using thermal images
    title_jp: 熱赤外線画像を用いた自己位置推定
    description: This study aims to develop a self-localization method using thermal images to enable robots to move accurately at night or in dark environments. The main feature of this research is the adaptation of a deep learning model trained with visible-light camera images to thermal infrared camera images. Thermal infrared cameras can capture images in the dark. Still, their images often have low contrast and unclear details, making it difficult for robots to recognize environmental features and estimate their position. To address this issue, the proposed method transfers clear feature information obtained from visible-light images into the learning process, enabling the model to extract stable environmental structures from thermal images. As a result, robots can estimate their own position in real time and perform safe navigation and mapping even in harsh outdoor environments without streetlights. In the future, this technology is expected to realize autonomous systems that operate regardless of lighting conditions and contribute to automated nighttime security and patrol tasks.
    description_jp: 本研究では，夜間や暗所でもロボットが正確に移動するための，熱画像を用いた自己位置推定技術を開発しています．本手法の特徴は，可視光カメラ画像で構築した深層学習モデルを，熱赤外線カメラ画像用に活用する点です．熱赤外線カメラは暗闇を観測できますが，画像が不鮮明になりやすく，ロボットが環境の特徴を捉えにくいという課題があります．そこで，可視光画像から得られる鮮明な特徴情報を学習に反映し，熱画像からも環境構造を安定して読み取れるようにします．これにより，街灯のない屋外などの過酷な環境でも，ロボットが自己位置をリアルタイムに推定し，安全な移動や地図作成を行うことが可能になります．将来的には，明るさに依存せず自律的に活動できるシステムを実現し，夜間の警備や巡回作業の自動化に貢献することを目指します．
    media: /images/projects/intelligent-robotics/slam/kawahara.png
  order: 4

- id: 3d-reconstruction
  field_id: intelligent-robotics
  title: 3D Reconstruction
  title_jp: 三次元再構築
  description:  
  description_jp:  
  image: /images/projects/intelligent-robotics/3d-reconstruction/ippitsu.png
  subtopics:
  - title: 3D Environmental Information Acquisition via Handheld Measurement Device
    title_jp: ハンドヘルドデバイスを用いた3D環境情報の収集
    description: This study focuses on developing an original 3D SLAM system based on FAST-LIO2 to accurately acquire and utilize three-dimensional information from real environments. The proposed system integrates sensor data primarily from LiDAR and IMU sensors. It generates point cloud maps of indoor spaces and the areas around facilities using a handheld measurement device. Camera information may also be incorporated when necessary to improve the stability of self-localization and environmental recognition. The acquired point clouds are used not only for visualization, but also as fundamental data for understanding the shapes of spaces and facilities. The system also emphasizes practical usability in field environments, enabling flexible measurement in locations where installing fixed equipment is difficult. In the future, the study aims to represent building interiors and facility structures as three-dimensional models from the acquired point clouds. Through this approach, the research is expected to contribute to applications such as maintenance inspection, spatial recording, and digital twins.
    description_jp: 本研究では，FAST-LIO2を基盤とした独自の3D SLAMシステムを構築し，実環境の3次元情報を高精度に取得・活用する手法の研究に取り組んでいます．LiDARとIMUを中心としたセンサ情報を統合し，ハンドヘルド型の計測装置によって，屋内や設備周辺の点群地図を生成します．また，必要に応じてカメラ情報の利用も視野に入れ，より安定した自己位置推定と環境認識の実現を目指します．取得した点群は，単なる可視化だけでなく，空間や設備の形状を理解するための基礎データとして活用します．将来的には，取得点群から建物内部や設備構造を3Dモデルとして表現し，保守点検，空間記録，デジタルツインなどへの応用につなげることを目指しています．
    media: /images/projects/intelligent-robotics/3d-reconstruction/ippitsu.png
  order: 5

