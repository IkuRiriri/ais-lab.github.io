- id: grasping-support
  field_id: hri
  title: Grasping Support
  title_jp: 把持支援
  description:  
  description_jp:  
  image: /images/projects/hri/grasping-support/angga.png
  subtopics:
  - title: Assistive hand movement control based on low-density sEMG
    title_jp: 低密度sEMGによる手腕動作の認識
    description: This research investigates a low-density sEMG-based control framework for personal assistive hand movement, targeting post-stroke or hand-impaired users. Instead of relying on many EMG channels or highly generalized cross-subject models, this work focuses on a practical three-sensor setup placed on selected forearm muscles. The system aims to decode the user’s intended hand or wrist movement from the healthy side and translate it into control signals for a robotic hand, gripper, or future exoskeleton device. The main research challenge is not only gesture classification accuracy, but the reliability of sEMG interpretation under realistic conditions, including inter-subject variability, session-to-session signal changes, electrode placement differences, and real-time constraints. Therefore, the proposed direction emphasizes personal calibration, robust segmentation, compact feature representation, and stable control-oriented recognition. The expected contribution is a practical proof-of-concept architecture showing that minimal sEMG sensing can support personalized assistive control for improving hand function and quality of life.
    description_jp: 本研究では，脳卒中や手腕に障害を持つユーザを対象に，低密度なsEMG（surface Electromyography）に基づく個人向け手腕動作支援フレームワークを開発します．sEMGは，皮膚表面の電極で筋収縮に伴う微小な筋電位を計測する手法です．本システムでは，多数のEMGチャンネルや汎用的な被験者間モデルに依存せず，前腕の選定筋に配置した3つのセンサから健側の手指や手首の運動意図を推定します．得られた情報をロボットハンド，グリッパ，また外骨格デバイスの制御信号へ変換することで，個人に適応した支援制御の実現を目指します．識別精度だけでなく，被験者の差異や電極位置のずれに対するロバスト性を高めることで，最小限のsEMG計測で手腕機能と生活の質の向上を支援できる実証的構成を示すことをゴールとして定めています．
    media: /images/projects/hri/grasping-support/angga.png

  - title: Grasp assistance device for daily living support
    title_jp: 日常支援のための把持補助デバイスの開発
    description: My research focuses on a grasp assistance method using a tendon-driven robotic hand/exoskeleton powered by a single motor. The study aims to support people with reduced grip strength, especially in aging societies, by developing a lightweight, low-cost, and user-friendly system. In this system, a single DYNAMIXEL motor controls multiple fingers cooperatively through a wire-driven mechanism that enables flexion and extension motions. In addition, the system performs grasp control without using external sensors by utilizing motor current values and position information, achieving both structural simplicity and operational safety. The research also investigates switching control modes according to different objects and estimating grasp states for stable grasping performance. In the future, this system is expected to be applied to daily life support and rehabilitation fields.
    description_jp: 本研究では，単一モータと腱駆動機構を用いたロボットハンドおよび外骨格による把持支援手法を開発しています．高齢者は，握力低下により日常動作が困難になる場合があり，外骨格に取り付けたデバイスで指の動きを制御することで把持動作を支援するデバイスが必要です．ただし，実用性の観点では，軽量かつ低コストであることが望ましいです．そこで本システムでは，1台のDYNAMIXELモータでワイヤを駆動し，複数指の屈曲と伸展を協調的に制御する機構を研究しています．また，外部センサを用いず，モータ電流値と位置情報を利用して把持状態を判断することで，構造の簡素化と安全な動作の両立を図ります．さらに，把持対象に応じた制御モードの切り替えや，把持状態推定に基づく安定した把持制御機能も実装することで，日常生活支援やリハビリテーション分野への応用を目指します．
    media: /images/projects/hri/grasping-support/luo.png
  order: 1

- id: quadrupedal-locomotion
  field_id: hri
  title: Quadrupedal Locomotion
  title_jp: 四足歩行ロコモーション
  description: 
  description_jp: 
  image: /images/projects/hri/quadrupedal-locomotion/quadrupedal-locomotion.jpg
  subtopics:
  - title: Pedestrian Guidance Using Nonverbal Communication by a Quadruped Robot
    title_jp: 非言語コミュニケーションを用いた四足歩行ロボットによる歩行者誘導
    description: This study aims to develop a pedestrian guidance method using nonverbal communication by a quadruped robot. In addition to conventional speech-based guidance methods, intuitive communication through robot motion can enable smoother interaction between humans and robots. This research focuses on nonverbal expressions, such as gestures and gait changes. It proposes a method in which the robot presents appropriate movements based on the person being guided's situation. By doing so, the robot encourages pedestrians to follow it naturally without requiring them to understand complex instructions. The proposed method also considers safety and comfort during guidance, including avoiding physical collisions with other pedestrians and maintaining an appropriate interpersonal distance that does not cause psychological pressure. Through this approach, the study aims to reduce the burden on humans of adapting to robot-specific behavior and to realize safe, comfortable, and intuitive pedestrian guidance. In the future, this technology is expected to be applied to guidance systems in public facilities.
    description_jp: 本研究では，非言語コミュニケーションを用いた四足歩行ロボットによる歩行者誘導手法の構築を目指しています．従来の音声案内に加えて，ロボットの動作を介した直感的な意思伝達を実現することで，人とロボットのより円滑な相互作用が可能になります．本研究では，仕草や歩容の変化などの非言語表現に着目し，誘導対象者の状況に応じた動作を提示することで，歩行者の自然な追従を促します．また，誘導中には他の歩行者との物理的衝突を回避し，心理的な威圧感を与えない適切な対人距離を維持することも考慮します．これにより，人がロボットの仕様に合わせる負担を減らし，直感的な意図伝達による安全で快適な誘導の実現を目指します．将来的には，公共施設などで人々を案内するロボットシステムへの応用が期待されます．
    media: /images/projects/hri/quadrupedal-locomotion/mitsushima.png
  order: 2

- id: face-generation
  field_id: hri
  title: Face Generation
  title_jp: 表情生成
  description:  
  description_jp:  
  image: /images/projects/hri/face-generation/nguyen.png
  subtopics:
  - title: 3D Avatar Reconstruction for Robotic system
    title_jp: ロボットのための3Dアバター再構築
    description: This research advances the development of high-fidelity digital twins for robotic systems, bridging the critical gap between human facial appearance and behavioral synthesis. Utilizing multi-view acquisition and state-of-the-art computer graphics, the study reconstructs realistic 3D avatars and behavioral clones designed to disentangle universal facial morphology from personalized, non-verbal cues. The technical framework employs dual deep learning pipelines to achieve this synthesis. To model non-verbal facial behavior, a neural network is trained on extensive dyadic interaction datasets, capturing the intricate social nuances of human engagement. Simultaneously, appearance reconstruction is facilitated by a model trained on large-scale datasets of facial profiles performing diverse expressions. This allows the system to accurately map facial geometry and the underlying mechanical nuances of human expression. Ultimately, these digital twins function as the foundational architecture for next-generation robotic facial interfaces. By integrating these high-fidelity models into virtual and mixed reality (VR/MR) environments, this research significantly enhances the realism and clinical efficacy of medical training simulations, providing practitioners with more responsive and lifelike patient-interaction experiences.
    description_jp: 本研究は，ロボットシステム向けの動的なデジタルツインの実現を目指し，マルチビュー画像とコンピュータグラフィックスを用いて普遍的な形状と個人特有の非言語特徴を分離することにより，写実的な3Dアバターと顔面の動きを再構築することに取り組んでいます．本フレームワークでは，複雑な社会的ニュアンスを捉えつつ非言語的な顔の動きをモデル化するために，多様な表情プロファイルを含む二者間インタラクションデータセットを用いてニューラルネットワークを学習させています．これらのデジタルツイン技術は，次世代ロボットの顔インターフェースにおける基盤アーキテクチャとして機能します．例えば，これらのモデルをVR（仮想現実）やMR（複合現実）環境に統合して医療訓練シミュレーションのリアリティと臨床効果を高めることで，医療従事者に対して，緊張感や現実感をより強く実感できる患者とのインタラクション体験を提供できます．
    media: /images/projects/hri/face-generation/nguyen.png

  - title: Natural Pain Facial Expression Generation for a Robot Patient Simulator
    title_jp: ロボット患者シミュレータの自然な痛み表情の生成
    description: This study focuses on facial expression generation for a robot patient simulator, aiming to better represent patient pain. In medical education, students need to observe a patient’s facial expressions and reactions as they learn to assess the situation and respond appropriately. If a robot patient can display expressions that reflect the degree and condition of pain, it can provide a more practical training environment for clinical practice. This study focuses on facial Action Units (AUs), which describe movements of facial parts. It analyzes how movements around the brow, eyes, and mouth affect the naturalness of pain expressions. In addition, impression evaluations are conducted to investigate which types of facial changes lead observers to perceive the expression as painful and natural. Through these analyses, the study aims to develop a clear and natural pain expression generation system that can be applied to medical education and nursing training.
    description_jp: 本研究では，ロボット患者シミュレータにおいて，患者の痛みを自然に表現する顔表情生成技術を開発しています．医療教育では，学生が患者の表情や反応を観察し，状態を判断しながら適切な対応を学ぶことが重要です．そのため，ロボット患者が痛みの程度や状況に応じた表情を示せれば，より実践的な訓練環境の構築につながります．本研究では，顔の動きを表すAction Units（AUs）に着目し，眉間，目元，口元の動きが痛み表情の自然さに与える影響を分析します．さらに，生成した表情に対する印象評価を行い，どのような変化が痛そうで自然に見えるかを検討します．最終的には，医療教育や看護訓練に活用できる，分かりやすく自然な痛み表情生成システムの実現を目指します．
    media: /images/projects/hri/face-generation/chenh.png
  order: 3

- id: conversational-ai
  field_id: hri
  title: Conversational AI
  title_jp: 対話システム
  description:  
  description_jp:  
  image: /images/projects/hri/conversational-ai/hanai.png
  subtopics:
  - title: Mental Care Dialogue System Emphasizing Empathetic Active Listening
    title_jp: 共感的傾聴を重視したメンタルケア対話システムの開発
    description: This study aims to develop a chatbot that supports daily mental health care by using a large language model, LLM. In modern society, many people experience stress and anxiety. Still, consultation with specialists is often delayed because of time constraints or psychological hesitation, such as wondering whether their concerns are serious enough to discuss. To address this issue, the proposed system incorporates knowledge from clinical psychology into prompts for the LLM. This design suppresses AI's tendency to provide immediate advice. Instead, it emphasizes active listening based on empathy and unconditional positive regard. In addition, the system leverages AI's anonymity and nonjudgmental nature to encourage users to disclose concerns they may otherwise hesitate to share with others. By providing an environment where users can easily express their feelings, this research aims to establish an autonomous mental care system that helps reduce psychological burden at an early stage.
    description_jp: 本研究では，大規模言語モデル，LLM，を活用し，日常的なメンタルヘルスを支援するチャットボットの構築を目指しています．現代社会ではストレスや不安を抱える人が多い一方で，時間的制約や心理的なためらいにより，専門家への相談が遅れる場合があります．そこで本研究では，臨床心理学の知見をプロンプトとしてLLMに組み込み，すぐに助言を与えるのではなく，共感と無条件の肯定的関心に基づく傾聴を重視した対話を実現します．また，AIの匿名性と非評価的な特性を活かし，人間相手では話しにくい悩みの自己開示を促します．これにより，誰もが気軽に心の内を話せる環境を提供し，精神的負担を早期に軽減する自律的なメンタルケアシステムの確立を目指します．
    media: /images/projects/hri/conversational-ai/hanai.png
  order: 4

- id: robotic-art
  field_id: hri
  title: Robotic Art
  title_jp: ロボットアート
  description:  
  description_jp:  
  image: /images/projects/hri/robotic-art/robotic-art.png
  subtopics:
  - title: 3D Mosaic Art System using a Robot Arm
    title_jp: ロボットアームを用いた立体モザイクアート生成
    description: My research focuses on developing a "Robotic Mosaic Art System" that generates intricate mosaic art by precisely arranging small parts using a robotic arm.The most prominent feature of this system is its ability to transform flat, two-dimensional paintings into tangible three-dimensional artworks. To achieve this, the system analyzes "semantic regions" and "depth" information extracted from the original images. Based on this visual data, it reconstructs a 3D structure, and the robotic arm physically stacks the parts layer by layer. Furthermore, the system incorporates a real-time observation mechanism using a camera. By continuously recognizing the current state of the workspace, it dynamically determines the optimal placement for the next part. This responsiveness allows the system to flexibly adapt to human interventions, such as a user manually adding or adjusting parts during the ongoing assembly process. Rather than merely programming a robot to repeat predefined mechanical movements, my ultimate goal is to create an interactive system. By allowing humans and robots to mutually influence each other, they can collaborate seamlessly to build a completely unique and original piece of art together.
    description_jp: 本研究では，ロボットアームを用いて小さなパーツを配置し，モザイクアートを生成する「ロボティクスモザイクアートシステム」を開発しています．最大の特徴は，平面的な絵画から立体的な作品を生み出す点です．画像から「意味的領域」と「奥行き」の情報を分析し，立体構造に変換したうえで，ロボットアームがパーツを積層していきます．また，カメラで現在の状況をリアルタイムに認識し，状況に応じて次に配置するパーツを動的に決定する仕組みを取り入れています．これにより，作品の生成途中に人間がパーツを追加したり変更したりといった介入にも柔軟に対応可能です．単にロボットが機械的な動きを繰り返すのではなく，人間とロボットが互いに影響を与え合いながら，一つのオリジナル作品を協働で作り上げるシステムを目指しています．
    media: /images/projects/hri/robotic-art/park.mp4
  order: 5

- id: emotion-recognition
  field_id: hri
  title: Emotion Recognition
  title_jp: 感情認識
  description:  
  description_jp:  
  image: /images/projects/hri/emotion-recognition/mahin.png
  subtopics:
  - title: Development of Smart Mirror System with Real-Time Emotion Recognition 
    title_jp: リアルタイム感情認識スマートミラーシステムの開発
    description: My research focuses on developing an emotion-aware Smart Mirror system that can recognize human emotions in real time using deep learning and intelligent display technology. The main goal of this project is to improve human–machine interaction by enabling intelligent systems to understand and respond to human emotional states.The research will begin with building a facial emotion recognition model using the FER-2013 dataset. After evaluating and optimizing the model to achieve reliable performance, larger datasets such as RAF-DB and AffectNet will be used to further improve accuracy and robustness. The optimized model will then be integrated into a small robotic Smart Mirror system equipped with a camera, where real-time facial images will be captured and analyzed to predict a user’s emotional state.Based on the detected emotion, the system will provide adaptive feedback through visual or verbal responses, creating a more interactive and empathetic user experience. This project combines computer vision, deep learning, and intelligent interface design using tools such as Python, PyTorch/TensorFlow, and OpenCV.The expected outcome is a functional prototype that can serve as a foundation for future emotion-aware systems in healthcare, education, and personal well-being, contributing to the development of more human-centered intelligent environments.
    description_jp: 本研究では，深層学習とインテリジェントディスプレイ技術を用いて，人の感情をリアルタイムに認識する感情認識スマートミラーシステムを開発しています．本システムは，人の表情から感情状態を推定し，その結果に応じた表示や音声応答を行うことで，人と機械のより自然な相互作用を実現することを目的としています．まず，FER-2013データセットを用いて表情感情認識モデルを構築し，評価と最適化を行います．その後，RAF-DBやAffectNetなどの大規模データセットを利用し，認識精度と頑健性の向上を図ります．最適化したモデルは，カメラを備えた小型ロボット型スマートミラーに実装し，取得した顔画像から感情を推定します．将来的には，医療，教育，ウェルビーイング分野で活用できる人間中心の知能化環境の基盤構築を目指します．
    media: /images/projects/hri/emotion-recognition/mahin.png
  order: 6